# 24fastgo — app runs under PM2 as 24fastgo-api on 127.0.0.1:5000-5003.
# ip_hash keeps Socket.IO long-polling handshakes on one process.
upstream fastgo24_api {
    ip_hash;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:5001 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:5002 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:5003 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 24fastgo.com www.24fastgo.com;

    ssl_certificate     /etc/letsencrypt/live/24fastgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/24fastgo.com/privkey.pem;

    root /var/www/24fastgo-web;
    index index.html;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/webp;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/    { proxy_pass http://fastgo24_api; }
    location /health  { proxy_pass http://fastgo24_api; }
    location /uploads/ {
        proxy_pass http://fastgo24_api;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location /socket.io/ {
        proxy_pass http://fastgo24_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # Hashed assets are immutable; index.html must always revalidate, or a stale
    # copy requests chunks a later deploy removed and renders a blank page.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    listen [::]:80;
    server_name 24fastgo.com www.24fastgo.com;
    location /.well-known/acme-challenge/ { root /var/www/24fastgo-acme; }
    location / { return 301 https://$host$request_uri; }
}
